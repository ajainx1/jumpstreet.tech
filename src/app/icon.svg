<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tileGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1310"/>
      <stop offset="100%" stop-color="#030806"/>
    </linearGradient>
    <linearGradient id="greenCandle3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="50%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
    <linearGradient id="arrowGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <filter id="tradeGlow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#00FF88" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Rounded Dark Tile Background -->
  <rect width="512" height="512" rx="128" fill="url(#tileGrad3)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#22C55E" stroke-width="8" stroke-opacity="0.4"/>

  <!-- Grid lines (subtle) -->
  <line x1="80" y1="200" x2="432" y2="200" stroke="#1F2E28" stroke-width="4" stroke-dasharray="8 8"/>
  <line x1="80" y1="320" x2="432" y2="320" stroke="#1F2E28" stroke-width="4" stroke-dasharray="8 8"/>

  <!-- Candlestick 1 (Ascending Small) -->
  <line x1="148" y1="270" x2="148" y2="380" stroke="#22C55E" stroke-width="6"/>
  <rect x="130" y="295" width="36" height="60" rx="8" fill="url(#greenCandle3)"/>

  <!-- Candlestick 2 (Ascending Mid) -->
  <line x1="228" y1="200" x2="228" y2="330" stroke="#22C55E" stroke-width="6"/>
  <rect x="210" y="225" width="36" height="75" rx="8" fill="url(#greenCandle3)"/>

  <!-- Candlestick 3 (Ascending High) -->
  <line x1="308" y1="130" x2="308" y2="270" stroke="#00FF88" stroke-width="6"/>
  <rect x="290" y="155" width="36" height="85" rx="8" fill="url(#greenCandle3)"/>

  <!-- Ascending Growth Vector & Arrow -->
  <path d="M100 370 L200 280 L280 210 L395 110" fill="none" stroke="url(#arrowGrad3)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#tradeGlow3)"/>
  <polygon points="380,85 425,100 405,145" fill="#00FF88" filter="url(#tradeGlow3)"/>
</svg>